name: Build ChargeCap

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Switch libraries
        run: dkp-pacman -S --needed --noconfirm switch-curl switch-zlib switch-mbedtls
      - name: Fetch libultrahand
        run: ./scripts/vendor-libultrahand.sh
      - name: Build install package
        run: make zip
      - uses: actions/upload-artifact@v4
        with:
          name: ChargeCap
          path: ChargeCap.zip
          if-no-files-found: error
